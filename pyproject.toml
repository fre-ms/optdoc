[project]
name = "optdoc"
version = "0.10.1"
description = "Makes photographed and scanned pages faithful: upright, unwarped in their true proportions, straightened, evenly lit, in their own colours; reproducible."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "fre.ms", email = "fre.ms@fre.ms" }]
keywords = ["scan", "photo", "document", "dewarp", "deskew", "perspective", "pdf", "reproducible"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
  "Topic :: Text Processing",
]
dependencies = [
  # the core the tools of docrepro share: configuration documents, errors, the command
  # line's manners, no network, the window's building blocks
  "doccor>=0.3",
  # <2: PyMuPDF 2.0 (MuPDF 1.28.5) shifts glyphs after a redaction; optdoc's pages are
  # redacted by PseudonyMed, so both pin the same range
  "pymupdf>=1.25,<2",
]

[project.optional-dependencies]
# the preparation itself; opencv-python (not -headless), as RapidOCR in ocrdoc has it, so
# that both tools can live in one environment
# pillow 13: what a picture says of itself is written again as optdoc.pictures expects
cleanup = ["opencv-python>=4.8", "numpy>=1.26", "pillow>=13", "pillow-heif>=0.18"]
gui = [
    "pyside6-essentials>=6.8",
]

[tool.uv.sources]
# a released tag: optdoc moves to a new doccor on purpose
doccor = { git = "https://github.com/fre-ms/doccor", tag = "v0.3.0" }

[project.scripts]
optdoc = "optdoc.cli:main"

[project.urls]
Source = "https://github.com/fre-ms/optdoc"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 900
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
