name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --dev --extra ocr --extra tables --extra gui --extra barcodes
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
          libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4
          libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfontconfig1
      - run: uv run ruff check optdoc tests bench packaging
      - run: uv run pytest -v --timeout=600 --durations=15
        env:
          QT_QPA_PLATFORM: offscreen

  sidecar:
    name: standalone program (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra ocr --extra tables --extra gui --extra barcodes --group build
      - run: uv run python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: optdoc-aarch64-apple-darwin
          path: |
            dist/optdoc-aarch64-apple-darwin
            dist/optdoc-aarch64-apple-darwin.sha256
            dist/optdoc-aarch64-apple-darwin.licences.json
          retention-days: 14
